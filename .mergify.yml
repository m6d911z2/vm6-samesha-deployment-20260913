pull_request_rules:
  - name: VM6 released note alias scope-gate merge 261001
    conditions:
      - base = vm6-note-alias-final-base-261001
      - title = VM6_NOTE_ALIAS_RELEASED_SCOPES_261001
      - author = livastic-vm6-primary-20260911
      - check-success = vm6-note-alias-scope-gate
    actions:
      merge:
        method: merge
merge_protections:
  - name: VM6 Deployment Easy
    if:
      - head = deployment-easy
    success_conditions:
      - base = main
  - name: VM6 Deployment Strict
    if:
      - head = deployment-strict
    success_conditions:
      - label = vm6-deployment-required
  - name: VM6 Note Alias Final Queue Source
    if:
      - head = vm6-note-alias-final-source-261001
    success_conditions:
      - base = main
merge_protections_settings:
  reporting_method: deployments
  post_comment: true

merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: vm6-app-selection-batch-timer-261001
    batch_size: 2
    batch_max_wait_time: 1 minute
    queue_conditions:
      - title ~= ^VM6_APPSEL_TIMER_(POSITIVE|TREATMENT)_261001$
    merge_conditions:
      - check-success = vm6-appsel-never-pass-261001
    merge_method: merge
    checks_timeout: null
